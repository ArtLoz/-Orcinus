<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="18 18 72 72">
  <!-- Orcinus icon: an orca's dorsal fin printed layer by layer on a build plate.
       The 108 x 108 grid is the adaptive icon grid; this view shows its middle 72,
       the part a launcher shows. The Android layers are
       app/src/main/res/drawable/ic_launcher_foreground.xml and
       app/src/main/res/values/launcher_colors.xml. -->
  <defs>
    <clipPath id="layers">
      <rect x="0" y="66" width="108" height="6"/>
      <rect x="0" y="58" width="108" height="6"/>
      <rect x="0" y="50" width="108" height="6"/>
      <rect x="0" y="42" width="108" height="6"/>
      <rect x="0" y="34" width="108" height="6"/>
      <rect x="0" y="26" width="108" height="6"/>
      <rect x="0" y="18" width="108" height="6"/>
    </clipPath>
  </defs>
  <rect x="0" y="0" width="108" height="108" fill="#1F2427"/>
  <path d="M30,72 C42,62 52,44 70,26 C64,44 64,60 76,72 Z" fill="#FFFFFF" clip-path="url(#layers)"/>
  <path d="M30,75 h48 a2,2 0 0 1 0,4 h-48 a2,2 0 0 1 0,-4 z" fill="#26A69A"/>
</svg>
